<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Blog | Ritesh Singh</title>

  <link
    rel="icon"
    type="image/png"
    href="../images/ritesh_pic.png"
  >


  <!-- Apply saved theme before rendering -->

  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark-mode');
    }
  </script>


  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="../css/style.css"
  />


  <style>

    .blog-page {

      max-width: 980px;

      margin: 0 auto;

      padding: 48px 32px 70px;

    }


    .blog-intro {

      max-width: 760px;

      margin: 18px 0 34px;

      color: var(--muted);

      font-size: 16px;

      line-height: 1.7;

    }


    #allBlogs {

      display: grid;

      gap: 20px;

    }


    .blog-list-card {

      display: grid;

      grid-template-columns:
        190px minmax(0, 1fr);

      overflow: hidden;

      background: #ffffff;

      border:
        1px solid var(--border);

      border-radius: 16px;

      box-shadow:
        0 8px 24px
        rgba(15, 23, 42, 0.07);

    }


    .blog-list-card img,
    .blog-thumb {

      width: 190px;

      height: 100%;

      min-height: 180px;

      object-fit: cover;

      display: block;

    }


    .blog-list-card > div {

      padding: 20px 22px;

    }


    .blog-title {

      margin: 0 0 6px;

      font-size: 21px;

      line-height: 1.35;

      color: var(--text);

    }


    .blog-meta {

      margin-bottom: 11px;

      color: var(--muted);

      font-size: 13px;

    }


    .blog-desc {

      margin: 0 0 13px;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.65;

    }


    .read-link {

      color: var(--primary);

      text-decoration: none;

      font-weight: 650;

      font-size: 14px;

    }


    .read-link:hover {

      text-decoration: underline;

    }


    /* Brand click + hover */

    .brand-link {

      text-decoration: none;

      color: inherit;

      transition:
        color 160ms ease;

    }


    .brand-link:hover {

      color: var(--primary);

    }


    /* Dark mode */

    html.dark-mode
    .blog-list-card {

      background: #171b21;

      border-color: #2d333b;

    }


    /* Mobile */

    @media
    (max-width: 700px) {

      .blog-page {

        padding:
          34px 20px 50px;

      }


      .blog-list-card {

        grid-template-columns:
          1fr;

      }


      .blog-list-card img,
      .blog-thumb {

        width: 100%;

        height: 200px;

      }

    }

  </style>

</head>



<body>

<div class="page">



  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="topbar">


    <a
      class="brand brand-link"
      href="../index.html"
      title="Back to Home"
    >

      Ritesh <span>Singh</span>

    </a>



    <nav class="nav">


      <a href="../index.html">
        Home
      </a>


      <a href="../about.html">
        About Me
      </a>


      <a href="../publications.html">
        Publications
      </a>


      <a href="../projects.html">
        Projects
      </a>


      <a href="../activities.html">
        Academic Activities
      </a>


      <a
        href="index.html"
        class="active"
      >
        Blog
      </a>



      <!-- SEARCH -->

      <button
        type="button"
        aria-label="Search"
        title="Search"
        onclick="toggleSiteSearch()"
        style="
          border:0;
          background:transparent;
          color:inherit;
          padding:0;
          display:inline-flex;
          align-items:center;
          cursor:pointer;
        "
      >

        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >

          <circle
            cx="11"
            cy="11"
            r="7"
            stroke="currentColor"
            stroke-width="2"
          />

          <path
            d="M16.5 16.5L21 21"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />

        </svg>

      </button>



      <!-- THEME -->

      <button
        class="theme-toggle"
        type="button"
        onclick="toggleTheme()"
        aria-label="Toggle light and dark mode"
        title="Light / Dark mode"
      >

        <span
          id="themeIcon"
          style="
            display:inline-flex;
            align-items:center;
            justify-content:center;
          "
          aria-hidden="true"
        ></span>

      </button>


    </nav>

  </header>



  <!-- =====================================================
       SEARCH
  ====================================================== -->

  <div
    id="siteSearch"
    style="
      display:none;
      padding:14px 62px;
      border-bottom:1px solid rgba(216,222,231,0.9);
      background:rgba(255,255,255,0.72);
    "
  >


    <form
      onsubmit="runSiteSearch(event)"
      style="
        display:flex;
        gap:10px;
        align-items:center;
      "
    >


      <input
        id="siteSearchInput"
        type="search"
        placeholder="Search this website..."
        aria-label="Search this website"
        style="
          flex:1;
          max-width:520px;
          padding:10px 12px;
          border:1px solid #d8dee7;
          border-radius:10px;
          font:inherit;
          color:inherit;
          background:#fff;
        "
      >


      <button
        type="submit"
        style="
          padding:10px 16px;
          border:0;
          border-radius:10px;
          background:#1f5ea9;
          color:#fff;
          font:inherit;
          font-weight:600;
          cursor:pointer;
        "
      >

        Search

      </button>


    </form>

  </div>



  <!-- =====================================================
       BLOG PAGE
  ====================================================== -->

  <main class="blog-page">


    <h1 class="page-title">

      Blog

    </h1>


    <p class="blog-intro">

      Thoughts and perspectives on low-power systems,
      Energy-Neutral Devices, sustainable IoT,
      embedded intelligence and future wireless networks.

    </p>


    <div id="allBlogs">

      <!--
        Blog entries are inserted automatically
        from ../js/blogs.js
      -->

    </div>


  </main>



  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <footer class="site-footer">

    © 2026, Ritesh Kumar
    <strong>Singh</strong>

  </footer>


</div>



<!-- =====================================================
     BLOG DATA
====================================================== -->

<script src="../js/blogs.js"></script>


<script>

  if (
    typeof renderAllBlogs ===
    'function'
  ) {

    renderAllBlogs(
      'allBlogs'
    );

  }

</script>



<!-- =====================================================
     SEARCH
====================================================== -->

<script>


  function toggleSiteSearch() {


    const search =
      document.getElementById(
        'siteSearch'
      );


    const input =
      document.getElementById(
        'siteSearchInput'
      );


    if (
      search.style.display === 'none' ||
      search.style.display === ''
    ) {

      search.style.display =
        'block';


      input.focus();

    }

    else {

      search.style.display =
        'none';

    }


  }



  function runSiteSearch(event) {


    event.preventDefault();


    const query =
      document
        .getElementById(
          'siteSearchInput'
        )
        .value
        .trim();


    if (!query) return;


    window.open(

      'https://www.google.com/search?q=' +

      encodeURIComponent(
        'site:riteshsingh.org ' +
        query
      ),

      '_blank',

      'noopener'

    );


  }


</script>



<!-- =====================================================
     THEME
====================================================== -->

<script>


  function updateThemeIcon() {


    const icon =
      document.getElementById(
        'themeIcon'
      );


    if (!icon) return;


    const isDark =
      document.documentElement
        .classList
        .contains(
          'dark-mode'
        );


    if (isDark) {

      icon.innerHTML = `

        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >

          <path
            d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5A8.5 8.5 0 1 0 20.5 14.2Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />

        </svg>

      `;

    }

    else {

      icon.innerHTML = `

        <svg
          width="25"
          height="25"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >

          <circle
            cx="12"
            cy="12"
            r="4"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="M12 2V4
               M12 20V22
               M4.93 4.93L6.34 6.34
               M17.66 17.66L19.07 19.07
               M2 12H4
               M20 12H22
               M4.93 19.07L6.34 17.66
               M17.66 6.34L19.07 4.93"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

        </svg>

      `;

    }


  }



  function toggleTheme() {


    const root =
      document.documentElement;


    const isDark =
      root.classList.toggle(
        'dark-mode'
      );


    localStorage.setItem(

      'theme',

      isDark
        ? 'dark'
        : 'light'

    );


    updateThemeIcon();


  }


  updateThemeIcon();


</script>


</body>

</html>
