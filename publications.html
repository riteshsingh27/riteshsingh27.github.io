<!-- SEARCH -->

<div
  id="siteSearch"
  style="
    display: none;
    padding: 14px 62px;
    border-bottom: 1px solid rgba(216,222,231,0.9);
    background: rgba(255,255,255,0.72);
  "
>
  <form
    onsubmit="runSiteSearch(event)"
    style="
      display: flex;
      gap: 10px;
      align-items: center;
    "
  >
    <input
      id="siteSearchInput"
      type="search"
      placeholder="Search this website..."
      aria-label="Search this website"
      style="
        flex: 1;
        max-width: 520px;
        padding: 10px 12px;
        border: 1px solid #d8dee7;
        border-radius: 10px;
        font: inherit;
        color: inherit;
        background: #fff;
      "
    >

    <button
      type="submit"
      style="
        padding: 10px 16px;
        border: 0;
        border-radius: 10px;
        background: #1f5ea9;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      "
    >
      Search
    </button>

  </form>
</div>
