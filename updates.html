<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Activities & Updates | Ritesh Singh</title>

  <link rel="icon" type="image/png" href="images/ritesh_pic.png">

  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark-mode');
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .updates-page {
      max-width: 980px;
      margin: 0 auto;
      padding: 44px 32px 64px;
    }

    .updates-intro {
      max-width: 760px;
      margin: 0 0 38px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .updates-year {
      margin-top: 42px;
    }

    .updates-year:first-of-type {
      margin-top: 0;
    }

    .updates-year-title {
      margin: 0 0 22px;
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
    }

    .updates-timeline {
      position: relative;
      padding-left: 28px;
    }

    .updates-timeline::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: rgba(26, 163, 163, 0.28);
    }

    .update-entry {
      position: relative;
      padding: 0 0 34px 24px;
    }

    .update-entry:last-child {
      padding-bottom: 0;
    }

    .update-dot {
      position: absolute;
      left: -27px;
      top: 7px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #1aa3a3;
      box-shadow: 0 0 0 5px rgba(26, 163, 163, 0.11);
    }

    .update-topline {
      display: flex;
      gap: 9px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .update-date {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .update-tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(26, 163, 163, 0.10);
      color: #168b8b;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .update-title {
      margin: 0 0 7px;
      font-size: 20px;
      line-height: 1.4;
      color: var(--text);
    }

    .update-text {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .update-image {
      display: block;
      width: min(100%, 520px);
      aspect-ratio: 16 / 9;
      object-fit: cover;
      margin-top: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
    }

    .update-inline-link {
      display: inline-flex;
      margin-top: 10px;
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 650;
    }

    .update-inline-link:hover {
      text-decoration: underline;
    }

    .activity-visual {
      margin: 15px 0 0;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-strong);
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
    }

    .activity-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 220ms ease;
    }

    .activity-visual:hover img {
      transform: scale(1.02);
    }

    .activity-visual figcaption {
      padding: 8px 11px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .activity-featured {
      position: relative;
      width: min(100%, 640px);
      aspect-ratio: 16 / 8.8;
    }

    .activity-featured figcaption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 40px 14px 12px;
      color: #fff;
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.74) 100%);
    }

    .activity-single-image {
      width: min(100%, 500px);
    }

    .activity-single-image img {
      aspect-ratio: 16 / 9;
    }

    .activity-gallery {
      width: min(100%, 640px);
      display: grid;
      grid-template-columns: 1.6fr 0.9fr;
      grid-template-rows: 245px auto;
      gap: 5px;
      padding: 5px;
    }

    .activity-gallery-main,
    .activity-gallery-side,
    .activity-gallery-last {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border-radius: 10px;
    }

    .activity-gallery-side {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 5px;
    }

    .activity-gallery-last {
      position: relative;
    }

    .activity-gallery-count {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.48);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
    }

    .activity-gallery figcaption {
      grid-column: 1 / -1;
      padding: 5px 7px 3px;
    }

    html.dark-mode .update-tag {
      background: rgba(130, 183, 244, 0.12);
      color: #8dc3ff;
    }

    html.dark-mode .updates-timeline::before {
      background: rgba(130, 183, 244, 0.28);
    }

    html.dark-mode .update-dot {
      background: #82b7f4;
      box-shadow: 0 0 0 5px rgba(130, 183, 244, 0.11);
    }

    @media (max-width: 700px) {
      .updates-page {
        padding: 34px 20px 50px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="topbar">

      <div class="brand">
        Ritesh <span>Singh</span>
      </div>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="publications.html">Publications</a>
        <a href="projects.html">Projects</a>
        <a href="activities.html">Academic Activities</a>

        <button
          type="button"
          aria-label="Search"
          title="Search"
          onclick="toggleSiteSearch()"
          style="border:0;background:transparent;color:inherit;padding:0;display:inline-flex;align-items:center;cursor:pointer;"
        >
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
            <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>

        <button
          class="theme-toggle"
          type="button"
          onclick="toggleTheme()"
          aria-label="Toggle light and dark mode"
          title="Light / Dark mode"
        >
          <span id="themeIcon" style="display:inline-flex;align-items:center;justify-content:center;" aria-hidden="true"></span>
        </button>
      </nav>

    </header>

    <div
      id="siteSearch"
      style="display:none;padding:14px 62px;border-bottom:1px solid rgba(216,222,231,0.9);background:rgba(255,255,255,0.72);"
    >
      <form onsubmit="runSiteSearch(event)" style="display:flex;gap:10px;align-items:center;">
        <input
          id="siteSearchInput"
          type="search"
          placeholder="Search this website..."
          aria-label="Search this website"
          style="flex:1;max-width:520px;padding:10px 12px;border:1px solid #d8dee7;border-radius:10px;font:inherit;color:inherit;background:#fff;"
        >
        <button
          type="submit"
          style="padding:10px 16px;border:0;border-radius:10px;background:#1f5ea9;color:#fff;font:inherit;font-weight:600;cursor:pointer;"
        >
          Search
        </button>
      </form>
    </div>

    <main class="updates-page">

      <h1 class="page-title">Activities &amp; Updates</h1>

      <p class="updates-intro">
        A chronological selection of research, publications, workshops, academic visits, collaborations and other recent professional activities.
      </p>

      <div id="allActivities">
        <!-- All activities are inserted automatically from js/activities.js -->
      </div>

    </main>

    <footer class="site-footer">
      © 2026, Ritesh Kumar <strong>Singh</strong>
    </footer>

  </div>

  <script src="js/activities.js"></script>
  <script>
    renderAllActivities('allActivities');
  </script>

  <script>
    function toggleSiteSearch() {
      const search = document.getElementById('siteSearch');
      const input = document.getElementById('siteSearchInput');

      if (search.style.display === 'none' || search.style.display === '') {
        search.style.display = 'block';
        input.focus();
      } else {
        search.style.display = 'none';
      }
    }

    function runSiteSearch(event) {
      event.preventDefault();
      const query = document.getElementById('siteSearchInput').value.trim();
      if (!query) return;

      window.open(
        'https://www.google.com/search?q=' + encodeURIComponent('site:riteshsingh.org ' + query),
        '_blank',
        'noopener'
      );
    }
  </script>

  <script>
    function updateThemeIcon() {
      const icon = document.getElementById('themeIcon');
      if (!icon) return;

      const isDark = document.documentElement.classList.contains('dark-mode');

      if (isDark) {
        icon.innerHTML = `
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5A8.5 8.5 0 1 0 20.5 14.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        `;
      } else {
        icon.innerHTML = `
          <svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 2V4 M12 20V22 M4.93 4.93L6.34 6.34 M17.66 17.66L19.07 19.07 M2 12H4 M20 12H22 M4.93 19.07L6.34 17.66 M17.66 6.34L19.07 4.93" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        `;
      }
    }

    function toggleTheme() {
      const root = document.documentElement;
      const isDark = root.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeIcon();
    }

    updateThemeIcon();
  </script>

</body>
</html>
